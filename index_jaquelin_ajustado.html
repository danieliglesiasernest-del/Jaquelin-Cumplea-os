<style>
:root{--night:#170d2d;--purple:#4b236d;--pink:#f4a9df;--lav:#d9b8ff;--white:#fff8ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--white)}
body{min-height:100svh;background:radial-gradient(ellipse at top,#6e438c 0%,#28133f 48%,#10091f 100%);overflow-x:hidden}
#stars{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}.star{position:absolute;color:#fff0b5;text-shadow:0 0 12px #e5b4ff;animation:twinkle 2.4s ease-in-out infinite alternate}@keyframes twinkle{from{opacity:.3;transform:scale(.75) rotate(-8deg)}to{opacity:1;transform:scale(1.15) rotate(12deg)}}
main{position:relative;z-index:1;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:clamp(8px,2vh,22px) 12px}.wrap{width:min(100%,560px);text-align:center}.eyebrow{font-size:clamp(.62rem,2.8vw,.75rem);letter-spacing:.18em;text-transform:uppercase;color:#efd8ff;margin:0 0 6px}h1{font-family:Georgia,'Times New Roman',serif;font-weight:500;font-size:clamp(1.75rem,7.5vw,3.1rem);line-height:1.04;margin:0 0 7px;text-shadow:0 0 22px #eea8ff99}.intro{margin:0 auto clamp(8px,1.6vh,18px);color:#f4eaff;line-height:1.35;max-width:440px;font-size:clamp(.88rem,3.8vw,1rem)}
.viewer{position:relative;margin:0 auto;width:min(100%,350px,calc((100svh - 250px)*267/515));border-radius:28px;padding:6px;background:linear-gradient(145deg,#f8dfff,#7c42a4 42%,#1a1029);box-shadow:0 18px 48px #05020b99,0 0 24px #d9a0ff33;transition:transform .3s ease}.viewer.pulse{animation:pulse .45s ease}@keyframes pulse{50%{transform:scale(.985)}}.screen{display:block;width:100%;aspect-ratio:267/515;object-fit:cover;border-radius:22px;background:#20123b}.controls{display:flex;align-items:center;justify-content:center;gap:8px;margin:clamp(8px,1.5vh,16px) auto 0}.btn{border:1px solid #ffffff77;border-radius:999px;padding:10px 16px;background:linear-gradient(110deg,#8e4fc0,#d85cae);color:white;font-weight:700;font-size:clamp(.82rem,3.5vw,1rem);cursor:pointer;box-shadow:0 8px 24px #08021366;min-width:0}.btn.secondary{background:#ffffff12;backdrop-filter:blur(8px)}.btn:focus-visible{outline:3px solid white;outline-offset:3px}.progress{display:flex;gap:8px;justify-content:center;margin-top:9px}.dot{width:8px;height:8px;border-radius:50%;background:#ffffff45;border:0;padding:0;cursor:pointer}.dot.active{background:#ffd7f2;box-shadow:0 0 12px #ffb8e9;transform:scale(1.25)}.hint{font-size:.72rem;color:#e6d3f8;margin:7px 0 0}.hidden{display:none!important}
@media(max-height:700px){main{padding-top:5px;padding-bottom:5px}.intro{margin-bottom:7px}.viewer{width:min(100%,300px,calc((100svh - 205px)*267/515))}.controls{margin-top:7px}.btn{padding:8px 12px}.progress{margin-top:7px}.hint{display:none}}
@media(min-width:700px){main{padding:22px}.viewer{width:min(100%,360px,calc((100svh - 260px)*267/515))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style></head>

let current=0;const img=document.getElementById('screen'),viewer=document.getElementById('viewer');
function render(){const s=slides[current];img.src=s.src;img.alt=s.alt;document.getElementById('eyebrow').textContent=s.eyebrow;document.getElementById('title').textContent=s.title;document.getElementById('intro').textContent=s.intro;document.getElementById('next').textContent=s.button;document.getElementById('back').classList.toggle('hidden',current===0);document.getElementById('progress').innerHTML=slides.map((x,i)=>`<button class="dot ${i===current?'active':''}" aria-label="Ir a pantalla ${i+1}" aria-current="${i===current?'step':'false'}" onclick="go(${i})"></button>`).join('');viewer.classList.remove('pulse');void viewer.offsetWidth;viewer.classList.add('pulse');}
function go(n){current=(n+slides.length)%slides.length;render()}
document.getElementById('next').addEventListener('click',()=>go(current===slides.length-1?0:current+1));document.getElementById('back').addEventListener('click',()=>go(current-1));document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(current===slides.length-1?0:current+1);if(e.key==='ArrowLeft'&&current>0)go(current-1)});
const starLayer=document.getElementById('stars');for(let i=0;i<45;i++){const s=document.createElement('span');s.className='star';s.textContent=['✦','✧','⋆','✶'][Math.floor(Math.random()*4)];s.style.left=Math.random()*100+'%';s.style.top=Math.random()*100+'%';s.style.fontSize=(9+Math.random()*16)+'px';s.style.animationDelay=(Math.random()*3)+'s';starLayer.appendChild(s)}render();
